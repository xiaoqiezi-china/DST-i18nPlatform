name: Build

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install -r python/requirements.txt

      - name: Build
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File python/build.ps1 -Python python -OutDir release

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = 'release\DST-MC-I18n-Tool.exe'
          if (-not (Test-Path $exe)) { throw "找不到发布产物：$exe" }
          $out = & $exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "程序 --help 退出码是 $LASTEXITCODE" }
          if ($out -notmatch 'DST-MC-I18n-Tool') { throw "帮助输出里没有程序名，发布可能不完整" }
          Write-Host '冒烟测试通过'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DST-MC-I18n-Tool
          path: release/DST-MC-I18n-Tool.exe

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $asset = 'release/DST-MC-I18n-Tool.exe'
          if (-not (Test-Path $asset)) { throw "找不到发布产物：$asset" }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --title "DST MC I18n Tool v$tag" --generate-notes
          } else {
            gh release upload $tag $asset --clobber
          }
